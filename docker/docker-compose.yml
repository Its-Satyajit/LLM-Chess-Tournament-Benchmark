services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/db.sqlite
      # CHANGE THIS for any real deployment — the server refuses to start
      # in production without it (see src/auth/index.ts)
      - JWT_SECRET=change-me-in-production
    volumes:
      - server-data:/app/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ../packages/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
